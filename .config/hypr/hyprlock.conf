general {
  disable_loading_bar = true
  hide_cursor = true
  ignore_empty_input = false
  # for 1s after it locks, if you wiggle the mouse it'll unlock
  grace = 1
}

background {
  monitor = # blank for all monitors
  # path to background
  path = $HOME/.config/wallpapers/catppuccin/catppuccin_02.jpg
  # fallback background color
  color = rgba(0, 0, 0, 0)
  # blur
  blur_size = 5
  blur_passes = 1
  noise = 0.0117
  contrast = 1.3000
  brightness = 0.8000
  vibrancy = 0.2100
  vibrancy_darkness = 0.0
}

auth {
  pam {
    enabled = true
    module = hyprlock
  }
  fingerprint {
    enabled = true
    ready_message = Scan fingerprint to unlock
    present_message = Scanning fingerprint
  }
}

input-field {
  monitor =
  size = 250, 50
  outline_thickness = 3
  dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  # outer_color = $color5
  # inner_color = $color0
  # font_color = $color12
  #fade_on_empty = true
  placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
  hide_input = false
  position = 0, 200
  halign = center
  valign = bottom
}

# Date
label {
  monitor =
  text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
  # color = $color12
  font_size = 34
  font_family = CaskaydiaCove Nerd Font 12
  position = 0, -150
  halign = center
  valign = top
}

# Time
label {
  monitor =
  text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
  font_size = 94
  font_family = CaskaydiaCove Nerd Font 12
  position = 0, 0
  halign = center
  valign = center
}

# User
label {
  monitor =
  text =    $USER
  # color = $color12
  font_size = 40
  font_family = CaskaydiaCove Nerd Font 12
  position = 0, 100
  halign = center
  valign = bottom
}

# Put a picture of choice here. Default is the current wallpaper
image {
  monitor =
  path = $HOME/.config/wallpapers/profile/katter.jpg
  size = 230
  rounding = -1
  border_size = 2
  # border_color = $color11
  rotate = 0
  reload_time = -1
  position = 0, 300
  halign = center
  valign = bottom
}
